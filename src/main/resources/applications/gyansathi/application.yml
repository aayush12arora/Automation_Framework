# =============================================================================
# APPLICATION CONFIGURATION: GyanSathi (www.gyansathi.com)
# =============================================================================
# This single file describes everything the framework needs to drive the
# application: its environments, pages, and element locators. Onboarding another
# application means copying this folder and editing the values below - no Java.
#
# NOTE ON LOCATORS
# ----------------
# The `home`, `login` and `studentCourses` locators were verified against the
# live rendered DOM. The remaining pages (register, searchResults) are still
# unverified STARTING POINTS based on common web patterns - inspect the element
# and update `type` + `value` before relying on them.
# =============================================================================

name: gyansathi

environments:
  prod:
    baseUrl: "https://www.gyansathi.com"
    apiBaseUrl: "https://www.gyansathi.com/api"
    properties:
      brand: "GyanSathi"

  # Add more environments as they exist, e.g.:
  # stage:
  #   baseUrl: "https://stage.gyansathi.com"

pages:

  # --- Home / landing page -------------------------------------------------
  home:
    path: "/"
    elements:
      body:
        type: TAG_NAME
        value: "body"
        description: "Page body (present on any site)"
      logo:
        type: CSS
        value: ".navbar-brand, a.logo, img[alt*='GyanSathi' i]"
        description: "Site logo / brand"
      loginButton:
        type: XPATH
        value: "//button[normalize-space()='Login']"
        description: "Login button in the top nav; navigates to /auth/login"
      registerLink:
        type: XPATH
        value: "//a[contains(translate(., 'REGISTER','register'),'register') or contains(translate(., 'SIGN','sign'),'sign up')]"
        description: "Register / Sign up link"
      searchInput:
        type: CSS
        value: "input[type='search'], input[name='q'], input[placeholder*='Search' i]"
        description: "Search box"
      searchButton:
        type: CSS
        value: "button[type='submit'], button[aria-label*='search' i]"
        description: "Search submit button"
      navMenu:
        type: CSS
        value: "nav, header nav, .navbar"
        description: "Primary navigation"

  # --- Login page ----------------------------------------------------------
  # Locators below were verified against the live rendered DOM. The page is
  # client-rendered, so the form appears a moment after the URL changes; every
  # framework action waits for visibility, so no explicit sleeps are needed.
  login:
    path: "/auth/login"
    elements:
      username:
        type: ID
        value: "username"
        description: "Username field (type=text, not an email input)"
      password:
        type: ID
        value: "password"
        description: "Password field"
      agreeToTerms:
        type: ID
        value: "agreedToTerms"
        description: "Privacy Policy / T&C checkbox; Sign In stays disabled until it is ticked"
      submit:
        type: CSS
        value: "button[type='submit']"
        description: "Sign In button; rendered with the disabled attribute until the form is valid"
      errorMessage:
        type: CSS
        value: "div.bg-red-50 p"
        description: "Red error banner. Beware: an unrelated 'Profile fetch failed' banner can render on page load"

  # --- Registration page ---------------------------------------------------
  register:
    path: "/register"
    elements:
      fullName:
        type: CSS
        value: "input[name='name'], #name, #fullName"
        description: "Full name field"
      email:
        type: CSS
        value: "input[name='email'], input[type='email']"
        description: "Email field"
      password:
        type: CSS
        value: "input[name='password'], input[type='password']"
        description: "Password field"
      submit:
        type: CSS
        value: "button[type='submit']"
        description: "Register submit button"

  # --- Search results page -------------------------------------------------
  searchResults:
    path: "/search"
    elements:
      resultsContainer:
        type: CSS
        value: ".results, .search-results, main"
        description: "Search results container"
      firstResult:
        type: CSS
        value: ".results a, .search-results a, main a"
        description: "First search result"

  # --- Student landing page (where a successful login lands) ---------------
  studentCourses:
    path: "/student/courses/available_courses"
    elements:
      heading:
        type: XPATH
        value: "//h1[normalize-space()='Available Courses']"
        description: "Page heading"
      logoutButton:
        type: XPATH
        value: "//button[normalize-space()='Logout']"
        description: "Logout button; only present once authenticated"

# Free-form data any test or flow can read via getApplicationConfig().getTestData()
# Per-test data (customers, credentials, expected values) lives instead in
# src/test/resources/TestData/<module>/<testName>.json - see TestDataReader.
testData:
  sampleSearchTerm: "physics"
  expectedBrandInUrl: "gyansathi"
