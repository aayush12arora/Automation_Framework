# =============================================================================
# GLOBAL FRAMEWORK CONFIGURATION
# =============================================================================
# These values are application-agnostic. They can be overridden at runtime with
# system properties, e.g.  mvn test -Dbrowser=firefox -Dheadless=true
# Application-specific settings (URLs, pages, locators) live under
# src/main/resources/applications/<application>/application.yml
# =============================================================================

# Which application configuration to load (folder name under resources/applications)
application=gyansathi

# Which environment inside that application config to target
environment=prod

# ---- Browser ----
browser=chrome
headless=true
# Comma-free window size, e.g. 1920x1080. Use "maximize" to maximize instead.
window.size=1920x1080
# Optional: incognito/private mode
browser.incognito=false
# Optional: explicit browser binary path (useful in CI/containers with a
# non-standard install). Leave blank to let Selenium auto-detect.
browser.binary=
# Optional: explicit driver binary path. Leave blank to let Selenium Manager
# provision the correct driver automatically.
driver.path=

# ---- Timeouts (seconds) ----
timeout.implicit=0
timeout.explicit=20
timeout.pageload=45
timeout.polling.millis=250

# ---- Remote / cloud execution ----
remote.execution=false
# Full Selenium Grid / cloud hub URL when remote.execution=true
remote.url=
# Cloud provider hints: local | grid | browserstack | saucelabs | lambdatest
remote.provider=local
browserstack.username=
browserstack.accesskey=
saucelabs.username=
saucelabs.accesskey=

# ---- Reporting / artifacts ----
report.path=test-output/reports
screenshot.path=test-output/screenshots
report.name=Automation Report
screenshot.on.failure=true
screenshot.on.pass=false

# ---- Retry flaky tests ----
retry.count=1

# ---- Flow (keyword-driven) engine ----
# Root folder (under resources) that contains executable flow definitions
flows.root=flows
# When true, an assertion failure inside a flow stops the flow immediately.
flows.failfast=true
